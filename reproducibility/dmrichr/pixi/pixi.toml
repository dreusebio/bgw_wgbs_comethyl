[workspace]
name = "growell-wgbs-dmrichr"
version = "0.1.0"
authors = ["George Eusebio Kuodza <gekuodza@health.ucdavis.edu>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64"]

[tasks]
check-pkgconfig = "pkg-config --modversion cairo freetype2 fontconfig expat"
install-gdtools = "Rscript -e 'install.packages(\"gdtools\", repos=\"https://cloud.r-project.org\")'"
test-gdtools    = "Rscript -e 'packageVersion(\"gdtools\")'"
install-dmrichr = "Rscript install_dmrichr.R"
test-r          = "Rscript -e 'sessionInfo()'"
test-dmrichr    = "Rscript -e 'library(DMRichR); packageVersion(\"DMRichR\")'"
install-lpa-pkgs = """Rscript -e '
  cran_pkgs <- c("tidyLPA", "rcompanion", "FSA")
  for (pkg in cran_pkgs) {
    if (!requireNamespace(pkg, quietly = TRUE)) {
      message("Installing: ", pkg)
      install.packages(pkg, repos = "https://cloud.r-project.org")
    } else {
      message("Already installed: ", pkg)
    }
  }
'"""
check-lpa-pkgs = """Rscript -e '
  pkgs <- c(
    "tidyLPA", "here", "tidyverse", "writexl", "lubridate",
    "ggpubr", "rstatix", "FSA", "patchwork", "car", "rcompanion",
    "ggplot2", "readxl", "openxlsx", "magrittr"
  )
  missing  <- pkgs[!sapply(pkgs, requireNamespace, quietly = TRUE)]
  ok       <- pkgs[sapply(pkgs, requireNamespace, quietly = TRUE)]
  cat("OK:     ", paste(ok,      collapse = ", "), "\n")
  cat("MISSING:", paste(missing, collapse = ", "), "\n")
  if (length(missing) > 0) stop("Some packages are missing.")
'"""

[dependencies]
